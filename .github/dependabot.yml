# Opens the dependency update pull requests that ci.yml gates and
# dependabot-auto-merge.yml lands.
#
# Without this file Dependabot raises security updates only, so the action SHAs
# pinned in the workflows would never be refreshed and the auto-merge workflow
# would have almost nothing to act on.
#
# Minor and patch updates are grouped per ecosystem to keep the pull request
# count down; majors are deliberately left ungrouped so each one arrives on its
# own and picks up the needs-manual-review label instead of holding a group
# hostage.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /crawler-agent-core
    schedule:
      interval: weekly
    groups:
      core:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /crawler-agent-fe
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /crawler-bot-protection-proxy
    schedule:
      interval: weekly
    groups:
      proxy:
        update-types:
          - minor
          - patch
