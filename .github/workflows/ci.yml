# Gates pull requests so dependency updates cannot land unverified.
#
# Every job runs on every pull request on purpose: a job skipped by a path
# filter never reports a status, and a required check that never reports blocks
# the pull request forever.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-agent-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crawler-agent-core/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-agent-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: crawler-agent-fe/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint

  proxy:
    name: proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-bot-protection-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: crawler-bot-protection-proxy/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn eslint 'src/**/*.ts'
      - run: yarn test
